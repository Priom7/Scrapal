name: scrapal

x-backend: &backend
  image: scrapal-backend:local
  build: .
  env_file: [.env]
  restart: unless-stopped
  volumes:
    - artifacts:/data/artifacts
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scrapal
      POSTGRES_USER: scrapal
      POSTGRES_PASSWORD: scrapal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapal -d scrapal"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: scrapal
      RABBITMQ_DEFAULT_PASS: scrapal
    command: /bin/sh -c "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15672:15672"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: /bin/sh -c "alembic upgrade head && uvicorn scrapal.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A scrapal.jobs.celery_app worker --loglevel=INFO --queues=ingest,ai,default --concurrency=2 --without-gossip --without-mingle

  scheduler:
    <<: *backend
    command: celery -A scrapal.jobs.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  console:
    build:
      context: console
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_KEY: ${SCRAPAL_API_KEY:-scrapal-local-dev-key}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  loki:
    image: grafana/loki:3.5.3
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: scrapal-local
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  flower:
    <<: *backend
    profiles: ["observability"]
    command: celery -A scrapal.jobs.celery_app flower --port=5555 --persistent=False
    ports:
      - "5555:5555"

volumes:
  artifacts:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
