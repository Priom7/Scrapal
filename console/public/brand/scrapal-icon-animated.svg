<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="360"
   height="360"
   viewBox="34 18 292 330"
   role="img"
   aria-labelledby="title desc" style="background:transparent"
   version="1.1"
   id="svg29"
   sodipodi:docname="scrapal_logo.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview29"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1" />
  <title id="title">Scrapal animated icon</title>
  <desc
     id="desc">Animated Scrapal logo matched to the supplied visual reference. The lower green thread retains its original rounded geometry and is optically spaced below the knowledge cube.</desc>
  <defs
     id="defs6">
    <linearGradient
       id="threadBlue"
       x1="50"
       y1="70"
       x2="275"
       y2="185"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#465CFF"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#3FA7E8"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="threadMint"
       x1="115"
       y1="185"
       x2="285"
       y2="295"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#34A8D8"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#42CFA0"
         id="stop4" />
    </linearGradient>
    <linearGradient
       id="threadLower"
       x1="60"
       y1="300"
       x2="285"
       y2="235"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#20C998"
         id="stop5" />
      <stop
         offset="1"
         stop-color="#42CFA0"
         id="stop6" />
    </linearGradient>
    <filter
       id="soft"
       x="-20%"
       y="-20%"
       width="140%"
       height="140%">
      <feGaussianBlur
         stdDeviation="0.35"
         id="feGaussianBlur6" />
    </filter>
  
    <style><![CDATA[
      #circle6, #circle7, #circle8, #circle9, #circle10, #circle11,
      #circle12, #circle13, #circle14, #circle15, #circle16, #circle17,
      #circle18, #circle19, #circle20, #circle21, #circle26,
      #g22, #g24, #g25, #path26, #g29 {
        transform-box: fill-box;
        transform-origin: center;
      }
      #circle6  { animation: scrapalPulse 2.1s ease-in-out 0.00s infinite; }
      #circle7  { animation: scrapalPulse 2.1s ease-in-out 0.12s infinite; }
      #circle8  { animation: scrapalPulse 2.1s ease-in-out 0.24s infinite; }
      #circle9  { animation: scrapalPulse 2.1s ease-in-out 0.48s infinite; }
      #circle10 { animation: scrapalPulse 2.1s ease-in-out 0.70s infinite; }
      #circle11 { animation: scrapalPulse 2.1s ease-in-out 0.92s infinite; }
      #circle12 { animation: scrapalBlink 1.35s ease-in-out 0.00s infinite; }
      #circle13 { animation: scrapalBlink 1.35s ease-in-out 0.16s infinite; }
      #circle14 { animation: scrapalBlink 1.35s ease-in-out 0.32s infinite; }
      #circle15 { animation: scrapalBlink 1.35s ease-in-out 0.52s infinite; }
      #circle16 { animation: scrapalBlink 1.35s ease-in-out 0.64s infinite; }
      #circle17 { animation: scrapalBlink 1.35s ease-in-out 0.76s infinite; }
      #circle18 { animation: scrapalBlink 1.35s ease-in-out 0.88s infinite; }
      #circle19 { animation: scrapalBlink 1.35s ease-in-out 1.00s infinite; }
      #circle20 { animation: scrapalBlink 1.35s ease-in-out 1.12s infinite; }
      #circle21 { animation: scrapalBlink 1.35s ease-in-out 1.24s infinite; }
      #g22      { animation: iconBreath 2.8s ease-in-out 0.0s infinite; }
      #g24      { animation: iconBreath 2.8s ease-in-out 0.35s infinite; }
      #g25      { animation: iconBreath 2.8s ease-in-out 0.70s infinite; }
      #path26   { animation: sparkPulse 1.8s ease-in-out 0.75s infinite; }
      #g29      { animation: iconBreath 2.8s ease-in-out 1.05s infinite; }
      #text29   { animation: wordmarkBreath 4.2s ease-in-out infinite; }
      @keyframes scrapalPulse {
        0%,100% { opacity:.72; transform:scale(.96); }
        50%     { opacity:1; transform:scale(1.06); }
      }
      @keyframes scrapalBlink {
        0%,100% { opacity:.38; }
        45%     { opacity:1; }
      }
      @keyframes iconBreath {
        0%,100% { opacity:.72; }
        50%     { opacity:1; }
      }
      @keyframes sparkPulse {
        0%,100% { opacity:.55; transform:scale(.86) rotate(0deg); }
        50%     { opacity:1; transform:scale(1.16) rotate(18deg); }
      }
      @keyframes wordmarkBreath {
        0%,100% { opacity:.94; }
        50%     { opacity:1; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>
  <!-- Threadline S mark -->
  <g
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="g11">
