  <!-- Animated data-flow particles. Original logo geometry is untouched. -->
  <g aria-hidden="true" pointer-events="none">
    <circle r="4.4" fill="#FFFFFF" opacity="0.96">
      <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#path6" />
      </animateMotion>
    </circle>
    <circle r="4.2" fill="#FFFFFF" opacity="0.92">
      <animateMotion dur="2.6s" begin="0.65s" repeatCount="indefinite" rotate="auto">
        <mpath href="#path7" />
      </animateMotion>
    </circle>
    <circle r="4.2" fill="#FFFFFF" opacity="0.92">
      <animateMotion dur="2.6s" begin="1.30s" repeatCount="indefinite" rotate="auto">
