server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A literal hostname in proxy_pass is resolved once at startup and cached for
  # the life of the worker, so a restarted api container gets a new IP and every
  # request 502s. Docker's embedded DNS plus a variable upstream forces nginx to
  # re-resolve, at the cost of having to rebuild the stripped path by hand.
  location ~ ^/api/(?<api_path>.*)$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream/$api_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Crawl and answer event streams must reach the browser immediately.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering no;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
