[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapal"
version = "0.1.0"
description = "A general-purpose scraping, RAG, and agentic knowledge platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "flower>=2.0,<3",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "langgraph>=0.3,<1",
  "markdownify>=0.14,<1",
  "ollama>=0.4,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "scrapy>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2,<3",
  "structlog>=25,<26",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "opentelemetry-instrumentation-redis>=0.57b0,<1",
  "opentelemetry-instrumentation-celery>=0.57b0,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.entry-points."scrapal.connectors"]
website = "scrapal.connectors.website:WebsiteConnector"
document = "scrapal.connectors.document:DocumentConnector"
greenwich = "scrapal.domain.university.greenwich:GreenwichConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "UP042", "UP046", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
